name: Production VPS CI/CD
jobs:
  test:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      DIRECT_URL: postgresql://ci:ci@127.0.0.1:5432/ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: 20.20.2
        cache: npm
    - name: Validate and build
      run: 'npm ci --no-audit --no-fund

        npm run lint

        npm run build'
  deploy:
    name: Deploy pinned commit to production VPS
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
    - name: Deploy and verify health
      uses: appleboy/ssh-action@v1.2.0
      with:
        host: ${{ secrets.DEPLOY_HOST }}
        username: ${{ secrets.DEPLOY_USER }}
        key: ${{ secrets.DEPLOY_SSH_KEY }}
        port: ${{ secrets.DEPLOY_PORT }}
        fingerprint: ${{ secrets.DEPLOY_FINGERPRINT }}
        command_timeout: 60m
        script: deploy ${{ github.sha }}
'on':
  push:
    branches:
    - master
  pull_request:
    branches:
    - master
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: production-duitku-api-${{ github.ref }}
  cancel-in-progress: false
